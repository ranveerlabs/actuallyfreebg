<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="apparently this needed to be paywalled">
    <meta name="theme-color" content="#000000">
    <title>actuallyfree.bg</title>
    <link rel="icon" href="data:,">
    <style>
      * { box-sizing: border-box; }
      html { height: 100%; }
      body { margin: 0; min-height: 100%; color: #fff; background: #000; font-family: Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      header { padding: 30px 36px; font-size: 18px; letter-spacing: -.6px; }
      main { min-height: calc(100svh - 140px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px 100px; text-align: center; }
      pre { margin: 0 0 34px; font-family: monospace; font-size: 28px; line-height: 1.2; }
      h1 { margin: 0; font-size: clamp(20px, 3.5vw, 32px); font-weight: 400; line-height: 1.25; letter-spacing: -1px; }
      footer { padding: 20px 36px; color: #999; font-size: 12px; }
      a { color: inherit; text-underline-offset: 3px; }
      a:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
      .upload { margin-top: 36px; }
      button, .download { display: inline-block; border: 1px solid #555; border-radius: 0; padding: 12px 20px; font: inherit; font-size: 14px; cursor: pointer; color: #fff; background: #000; text-decoration: none; }
      #pick, .download { color: #000; background: #fff; border-color: #fff; }
      button:disabled { opacity: .45; cursor: wait; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 5px; }
      .hint, #status { font-size: 12px; color: #999; line-height: 1.6; }
      #status { min-height: 20px; margin: 16px 0 0; }
      #result { width: min(100%, 580px); margin: 28px 0 0; }
      .image { background-color: #202020; background-image: conic-gradient(#303030 25%, transparent 0 50%, #303030 0 75%, transparent 0); background-size: 20px 20px; }
      #preview { display: block; width: 100%; max-height: 48svh; object-fit: contain; }
      .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
      [hidden] { display: none !important; }
      @media (max-width: 480px) { header { padding: 24px; } footer { padding: 20px 24px; } }
    </style>
  </head>
  <body>
    <header>actuallyfree.bg</header>
    <main>
      <pre role="img" aria-label="cat"> /\_/\
(=^.^=)</pre>
      <h1>apparently this needed to be paywalled</h1>
      <div class="upload">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="choose an image" hidden>
        <button id="pick" type="button">choose an image</button>
        <p class="hint">or drop one here / paste<br>your image stays in your browser</p>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="cancel" type="button" hidden>cancel</button>
      <figure id="result" hidden>
        <div class="image"><img id="preview" alt=""></div>
        <figcaption class="actions">
          <a id="save" class="download" hidden>download PNG</a>
          <button id="compare" type="button" aria-pressed="false" hidden>show original</button>
        </figcaption>
      </figure>
    </main>
    <footer><a href="https://github.com/ranveerlabs/actuallyfree.bg">source / AGPLv3</a></footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
