<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="apparently this needed to be paywalled">
    <meta name="theme-color" content="#000000">
    <title>actuallyfreebg</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>

    <main>
      <pre role="img" aria-label="actuallyfreebg logo"> /\_/\
(=^.^=)</pre>
      <h1>apparently this needed to be paywalled</h1>
      <div class="upload">
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp" aria-label="choose an image" hidden>
        <button id="pick" type="button">choose image</button>
        <p class="hint">or drop / paste</p>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="cancel" type="button" hidden>cancel</button>
      <figure id="result" hidden>
        <div class="image"><img id="preview" alt=""></div>
        <figcaption class="actions">
          <a id="save" class="download" hidden>download PNG</a>
          <button id="compare" type="button" aria-pressed="false" hidden>show original</button>
        </figcaption>
      </figure>
    </main>
    <footer><a href="https://github.com/ranveerlabs/actuallyfreebg">source</a></footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
